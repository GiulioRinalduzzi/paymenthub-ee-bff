/*
 * This file was generated by the Gradle 'init' task.
 */
plugins {
    id 'java'
    id 'maven-publish'
    id 'eclipse'
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

// Explicitly set the main class to avoid ASM version issues with JDK 17
bootJar {
    mainClass = 'org.apache.fineract.ServerApplication'
}

// Alternative syntax for newer Gradle versions
springBoot {
    mainClass = 'org.apache.fineract.ServerApplication'
}

// Make sure we're building a proper Spring Boot JAR
bootJar {
    enabled = true
    archiveClassifier = '' // This ensures bootJar replaces the default jar
}

// Disable the default jar task to avoid confusion
jar {
    enabled = false
}

configurations.all {
    // camel-xml-jaxb (via connector-common) pulls the com.sun.xml.bind
    // re-publication of the JAXB runtime; the same classes already arrive via
    // the canonical org.glassfish.jaxb coordinates, and bootJar rejects the
    // duplicate jaxb-core jar entry. Same fix as identity-account-mapper.
    exclude group: 'com.sun.xml.bind', module: 'jaxb-core'
    exclude group: 'com.sun.xml.bind', module: 'jaxb-impl'
}

repositories {
    mavenCentral()
    maven { url = uri('https://repo.spring.io/libs-release') }
    maven { url = uri('https://repository.jboss.org/nexus/content/repositories/releases') }
    maven { url = uri('https://mifos.jfrog.io/artifactory/phee-gradle-local') }
    maven { url = uri('https://mifos.jfrog.io/artifactory/mifosx-gradle-local') }
}

dependencies {
    // Mifos Platform BOM pins Spring Boot 3.4, Jakarta EE 10, EclipseLink 4,
    // Flyway 10 and every other shared library version. Do NOT hardcode
    // managed versions. This is a deployable application (leaf node), so use
    // enforcedPlatform().
    implementation enforcedPlatform('org.mifos:paymenthub-ee-bom:2.0.0-SNAPSHOT')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // Spring Security 6 line. The old Spring Security OAuth2 stack
    // (spring-security-oauth2 2.4.1 + spring-security-jwt) was discontinued and
    // does not exist for Spring Boot 3: the resource-server side moved to
    // spring-boot-starter-oauth2-resource-server (Nimbus JOSE), the /oauth/token
    // endpoint is re-implemented in TokenController.
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.json:json'
    implementation 'org.eclipse.persistence:org.eclipse.persistence.jpa'
    annotationProcessor 'org.hibernate.orm:hibernate-jpamodelgen'
    implementation 'jakarta.persistence:jakarta.persistence-api'
    implementation 'joda-time:joda-time:2.10.6'
    implementation 'org.apache.commons:commons-lang3'
    implementation 'com.zaxxer:HikariCP'
    implementation 'com.mysql:mysql-connector-j'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    // Ehcache 2 (net.sf.ehcache) removed: Spring 6 dropped EhCacheCacheManager.
    // Caffeine provides the same TTL/max-size semantics (see CacheConfig).
    implementation 'com.github.ben-manes.caffeine:caffeine'
    testImplementation 'junit:junit:4.11'
    implementation 'net.sf.supercsv:super-csv:2.4.0'
    implementation 'com.amazonaws:aws-java-sdk:1.11.486'
    implementation 'com.azure:azure-storage-blob:12.12.0'
    implementation 'commons-io:commons-io:2.4'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui'
    // was org.mifos:ph-ee-connector-common, republished under the new repo
    // structure; same org.mifos.connector.common packages, no import changes
    implementation 'org.mifos:paymenthub-ee-core:2.0.0-SNAPSHOT'
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
}

// is the group correct or should be org.mifos ??
group = 'org.apache.fineract'
version = '2.0.0.mifos-SNAPSHOT'
description = 'paymenthub-ee-bff'
sourceCompatibility = '21'
targetCompatibility = '21'

sourceSets {
    generated {
        java {
            srcDirs = ['src/generated/java']
        }
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.generatedSourceOutputDirectory = file("src/generated/java")
    options.release = 21
    options.compilerArgs.addAll([
        '-parameters'
    ])
}
